<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRANSPORTE INTERNO - TELSTAR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef3f8;
      color: #1b2430;
    }
    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 8px 12px 20px 12px;
    }
    .header {
      background: #ffffff;
      color: #111111;
      border-bottom: 3px solid #0b3b78;
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .brand-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .telstar-svg {
      height: 36px;
      width: auto;
      display: block;
    }
    .sub {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #0b3b78;
      text-transform: uppercase;
    }
    .counter {
      background: #0b3b78;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      margin-top: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .bigbtn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: #0078d4;
      color: #fff;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;
    }
    .field-label {
      display: block;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 6px;
      color: #0b3b78;
    }
    .input-nombre {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 2px solid #cbd6e2;
      border-radius: 12px;
    }
    .action-trigger {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 2px solid #0078d4;
      border-radius: 12px;
      background: #eaf4fc;
      color: #005a9e;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .sign-trigger {
      border-color: #0b3b78;
      background: #edf2f9;
      color: #0b3b78;
    }
    .signature-box {
      margin-top: 14px;
      padding: 12px;
      border: 2px solid #0b3b78;
      border-radius: 14px;
      background: #f8fbff;
    }
    #canvasFirma {
      width: 100%;
      height: 200px;
      display: block;
      background: #fff;
      border: 2px dashed #9fb3c8;
      border-radius: 10px;
      touch-action: none;
    }
    .sign-preview {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #d5e0ec;
      border-radius: 12px;
      background: #f9fbfe;
    }
    .sign-preview img {
      max-width: 100%;
      max-height: 120px;
      display: block;
      margin-top: 8px;
      background: #fff;
    }
    video {
      width: 100%;
      max-height: 420px;
      background: #111;
      border-radius: 14px;
      margin-top: 12px;
      display: block;
    }
    .btn {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .snap { background: #0078d4; }
    .save { background: #107c10; }
    .clear { background: #5c6b7c; }
    .close { background: #d83b01; }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .thumb-box {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #111;
    }
    .thumb-box img {
      width: 100%;
      height: 95px;
      object-fit: cover;
      display: block;
    }
    .thumb-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #c50f1f;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 3px 7px;
      font-weight: 700;
      cursor: pointer;
    }
    .accordion-toggle {
      width: 100%;
      background: #f4f7fb;
      border: 2px solid #d5e0ec;
      border-radius: 14px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 17px;
      font-weight: 800;
      color: #0b3b78;
      cursor: pointer;
    }
    .accordion-content {
      display: none;
      margin-top: 12px;
    }
    .accordion-content.open {
      display: block;
    }
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f4f7fb;
      border: 1px solid #d5e0ec;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .filter-bar label {
      font-size: 14px;
      font-weight: 700;
      color: #0b3b78;
      white-space: nowrap;
    }
    .filter-select {
      flex: 1;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #b8c7d9;
      background: #fff;
      font-size: 14px;
      font-weight: 700;
      color: #1b2430;
    }
    .day-group {
      border: 1px solid #d5e0ec;
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
      background: #fff;
    }
    .day-toggle {
      width: 100%;
      background: #eaf1f8;
      border: none;
      padding: 13px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 800;
      color: #0b3b78;
      cursor: pointer;
      text-align: left;
    }
    .day-badge {
      background: #0b3b78;
      color: #fff;
      border-radius: 12px;
      padding: 2px 9px;
      font-size: 12px;
      margin-left: 6px;
    }
    .day-content {
      display: none;
      padding: 12px;
      background: #ffffff;
    }
    .day-content.open {
      display: block;
    }
    .item {
      background: #f9fbfe;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .item:last-child {
      margin-bottom: 0;
    }
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .photo-card img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
      background: #111;
    }
    .download-sm {
      display: block;
      margin-top: 6px;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      background: #0078d4;
      font-weight: 700;
      font-size: 13px;
    }
    .delete {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #c50f1f;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand-block">
        <svg class="telstar-svg" viewBox="0 0 360 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telstar - A Syntegon Company">
          <text x="0" y="54" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="60" letter-spacing="-1.5">Telstar</text>
          <rect x="205" y="42" width="12" height="12" fill="none" stroke="#000000" stroke-width="3.5"/>
          <text x="36" y="80" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="14.5" letter-spacing="0.6">A SYNTEGON COMPANY</text>
        </svg>
        <div class="sub">Transporte interno · v2.6</div>
      </div>
      <div id="contador" class="counter">Hoy: 0</div>
    </div>

    <div class="card">
      <button type="button" class="bigbtn" onclick="abrirFormulario()">📷 NUEVO REGISTRO</button>

      <div id="formularioRegistro" style="display:none;">
        <div id="menuRegistro">
          <label class="field-label" for="nombre">Proveedor/cliente</label>
          <input type="text" id="nombre" class="input-nombre" placeholder="Escribe el proveedor o cliente...">

          <button type="button" id="btnAbrirFirma" class="action-trigger sign-trigger" onclick="abrirFirma()">✍️ FIRMAR</button>

          <div id="previewFirmaBorrador" class="sign-preview" style="display:none;">
            <b>✅ Firma guardada</b>
            <button type="button" onclick="quitarFirmaBorrador()" style="margin-left:8px;">Quitar</button>
            <img id="imgFirmaBorrador" alt="Firma">
          </div>

          <button type="button" id="btnAbrirCamara" class="action-trigger" onclick="iniciarCamara()">📸 ABRIR CÁMARA</button>

          <div id="camara" style="display:none;">
            <video id="video" autoplay playsinline muted></video>
            <button type="button" class="btn snap" onclick="sacarFoto()">📷 SACAR FOTO</button>
            <button type="button" class="btn close" onclick="cerrarCamara()">❌ CERRAR CÁMARA</button>
          </div>

          <div id="seccionBorrador" style="display:none; margin-top:14px;">
            <div id="tituloBorrador" style="font-weight:700; color:#0b3b78;">Fotos capturadas (0):</div>
            <div id="miniaturasBorrador" class="thumbs"></div>
          </div>

          <button type="button" class="btn save" onclick="guardarRegistro()">✅ GUARDAR REGISTRO</button>
        </div>

        <div id="panelFirma" class="signature-box" style="display:none;">
          <div style="font-weight:800; color:#0b3b78; margin-bottom:8px;">✍️ Recuadro de firma</div>
          <canvas id="canvasFirma"></canvas>
          <button type="button" class="btn clear" onclick="limpiarFirma()">🧹 LIMPIAR FIRMA</button>
          <button type="button" class="btn save" onclick="guardarFirma()">✅ GUARDAR FIRMA</button>
          <button type="button" class="btn close" onclick="cancelarFirma()">❌ CANCELAR</button>
        </div>
      </div>
    </div>

    <div class="card">
      <button type="button" id="btnHistorial" class="accordion-toggle" onclick="toggleHistorial()">
        <span>📋 Historial de registros (<span id="totalHistorial">0</span>)</span>
        <span id="flechaHistorial">▼</span>
      </button>
      <div id="historialPanel" class="accordion-content">
        <div class="filter-bar">
          <label for="filtroDia">📅 Filtrar día:</label>
          <select id="filtroDia" class="filter-select" onchange="cambiarFiltroDia()">
            <option value="TODOS">Todos los días</option>
          </select>
        </div>
        <div id="historial"></div>
      </div>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    var DB_NAME = 'TransporteInternoDB';
    var STORE_NAME = 'registros';
    var db = null;
    var stream = null;
    var historialAbierto = false;
    var diasAbiertos = {};
    var diaSeleccionado = 'TODOS';
    var fotosBorrador = [];
    var firmaBorrador = null;
    var dibujando = false;
    var tieneTrazo = false;
    var ultimoX = 0;
    var ultimoY = 0;

    function abrirBD(cb) {
      if (db) return cb(null, db);
      if (!window.indexedDB) return cb(new Error('No IndexedDB'), null);
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains(STORE_NAME)) {
          d.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = function (e) {
        db = e.target.result;
        cb(null, db);
      };
      req.onerror = function (e) {
        cb(e.target.error || new Error('Error DB'), null);
      };
    }

    function obtenerRegistros(cb) {
      abrirBD(function (err, d) {
        if (err || !d) return cb([]);
        var tx = d.transaction(STORE_NAME, 'readonly');
        var st = tx.objectStore(STORE_NAME);
        var req = st.getAll();
        req.onsuccess = function () { cb(req.result || []); };
        req.onerror = function () { cb([]); };
      });
    }

    function guardarEnBD(reg, cb) {
      abrirBD(function (err, d) {
        if (err || !d) return cb(err || new Error('Sin DB'));
        var tx = d.transaction(STORE_NAME, 'readwrite');
        var st = tx.objectStore(STORE_NAME);
        var req = st.add(reg);
        req.onsuccess = function () { cb(null); };
        req.onerror = function (e) { cb(e.target.error || new Error('Error guardar')); };
      });
    }

    function borrarEnBD(id, cb) {
      abrirBD(function (err, d) {
        if (err || !d) return cb();
        var tx = d.transaction(STORE_NAME, 'readwrite');
        var st = tx.objectStore(STORE_NAME);
        var req = st.delete(id);
        req.onsuccess = function () { cb(); };
        req.onerror = function () { cb(); };
      });
    }

    function abrirFormulario() {
      cerrarCamara();
      fotosBorrador = [];
      firmaBorrador = null;
      renderBorrador();
      renderFirma();
      document.getElementById('panelFirma').style.display = 'none';
      document.getElementById('menuRegistro').style.display = 'block';
      document.getElementById('formularioRegistro').style.display = 'block';
      var inp = document.getElementById('nombre');
      inp.value = '';
      inp.focus();
    }

    function prepFirma() {
      var c = document.getElementById('canvasFirma');
      var ctx = c.getContext('2d');
      var r = c.getBoundingClientRect();
      c.width = Math.max(300, Math.round(r.width || 500));
      c.height = Math.max(180, Math.round(r.height || 200));
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.strokeStyle = '#0b2545';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      dibujando = false;
      tieneTrazo = false;
    }

    function abrirFirma() {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      cerrarCamara();
      document.getElementById('menuRegistro').style.display = 'none';
      document.getElementById('panelFirma').style.display = 'block';
      setTimeout(prepFirma, 30);
    }

    function limpiarFirma() {
      prepFirma();
    }

    function cancelarFirma() {
      dibujando = false;
      document.getElementById('panelFirma').style.display = 'none';
      document.getElementById('menuRegistro').style.display = 'block';
    }

    function guardarFirma() {
      if (!tieneTrazo) {
        alert('Dibuja una firma antes de guardar.');
        return;
      }
      firmaBorrador = document.getElementById('canvasFirma').toDataURL('image/png');
      renderFirma();
      document.getElementById('panelFirma').style.display = 'none';
      document.getElementById('menuRegistro').style.display = 'block';
    }

    function quitarFirmaBorrador() {
      firmaBorrador = null;
      renderFirma();
    }

    function renderFirma() {
      var box = document.getElementById('previewFirmaBorrador');
      var img = document.getElementById('imgFirmaBorrador');
      var btn = document.getElementById('btnAbrirFirma');
      if (!firmaBorrador) {
        box.style.display = 'none';
        img.src = '';
        btn.innerHTML = '✍️ FIRMAR';
      } else {
        img.src = firmaBorrador;
        box.style.display = 'block';
        btn.innerHTML = '✍️ VOLVER A FIRMAR';
      }
    }

    function posFirma(cx, cy) {
      var c = document.getElementById('canvasFirma');
      var r = c.getBoundingClientRect();
      return {
        x: ((cx - r.left) / (r.width || 1)) * c.width,
        y: ((cy - r.top) / (r.height || 1)) * c.height
      };
    }

    function initFirmaEventos() {
      var c = document.getElementById('canvasFirma');
      function down(x, y) {
        var ctx = c.getContext('2d');
        var p = posFirma(x, y);
        dibujando = true;
        tieneTrazo = true;
        ultimoX = p.x;
        ultimoY = p.y;
        ctx.beginPath();
        ctx.moveTo(ultimoX, ultimoY);
      }
      function move(x, y) {
        if (!dibujando) return;
        var ctx = c.getContext('2d');
        var p = posFirma(x, y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ultimoX = p.x;
        ultimoY = p.y;
      }
      function up() { dibujando = false; }

      if (window.PointerEvent) {
        c.addEventListener('pointerdown', function (e) { e.preventDefault(); down(e.clientX, e.clientY); });
        c.addEventListener('pointermove', function (e) { if (dibujando) { e.preventDefault(); move(e.clientX, e.clientY); } });
        c.addEventListener('pointerup', up);
        c.addEventListener('pointercancel', up);
      } else {
        c.addEventListener('touchstart', function (e) { e.preventDefault(); if (e.touches[0]) down(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
        c.addEventListener('touchmove', function (e) { if (dibujando && e.touches[0]) { e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); } }, { passive: false });
        c.addEventListener('touchend', up);
      }
    }

    function toggleHistorial() {
      historialAbierto = !historialAbierto;
      document.getElementById('historialPanel').className = historialAbierto ? 'accordion-content open' : 'accordion-content';
      document.getElementById('flechaHistorial').innerHTML = historialAbierto ? '▲' : '▼';
    }

    function cambiarFiltroDia() {
      var sel = document.getElementById('filtroDia');
      diaSeleccionado = sel.value;
      if (diaSeleccionado !== 'TODOS') {
        diasAbiertos[diaSeleccionado] = true;
      }
      cargar();
    }

    function toggleDia(fecha) {
      diasAbiertos[fecha] = !diasAbiertos[fecha];
      cargar();
    }

    function iniciarCamara() {
      var v = document.getElementById('video');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('No se puede acceder a la cámara en este navegador.');
        return;
      }
      cerrarCamara();
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      }).then(function (s) {
        stream = s;
        v.srcObject = s;
        v.play();
        document.getElementById('camara').style.display = 'block';
        document.getElementById('btnAbrirCamara').style.display = 'none';
      }).catch(function () {
        alert('No se pudo abrir la cámara. Revisa permisos.');
      });
    }

    function cerrarCamara() {
      var v = document.getElementById('video');
      if (stream) {
        stream.getTracks().forEach(function (t) { t.stop(); });
        stream = null;
      }
      if (v) v.srcObject = null;
      document.getElementById('camara').style.display = 'none';
      document.getElementById('btnAbrirCamara').style.display = 'block';
    }

    function sacarFoto() {
      var v = document.getElementById('video');
      if (!stream || !v || v.readyState < 2 || !v.videoWidth) {
        alert('Espera un momento a que cargue la imagen de la cámara.');
        return;
      }
      var maxW = 1280;
      var w = v.videoWidth;
      var h = v.videoHeight;
      if (w > maxW) {
        h = Math.round(h * (maxW / w));
        w = maxW;
      }
      var c = document.getElementById('canvas');
      c.width = w;
      c.height = h;
      var ctx = c.getContext('2d');
      ctx.drawImage(v, 0, 0, w, h);
      fotosBorrador.push(c.toDataURL('image/jpeg', 0.72));
      renderBorrador();
    }

    function quitarFoto(i) {
      fotosBorrador.splice(i, 1);
      renderBorrador();
    }

    function renderBorrador() {
      var sec = document.getElementById('seccionBorrador');
      var tit = document.getElementById('tituloBorrador');
      var box = document.getElementById('miniaturasBorrador');
      if (!fotosBorrador.length) {
        sec.style.display = 'none';
        box.innerHTML = '';
        return;
      }
      sec.style.display = 'block';
      tit.innerHTML = 'Fotos capturadas (' + fotosBorrador.length + '):';
      box.innerHTML = '';
      for (var i = 0; i < fotosBorrador.length; i++) {
        (function (idx) {
          var d = document.createElement('div');
          d.className = 'thumb-box';
          var im = document.createElement('img');
          im.src = fotosBorrador[idx];
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'thumb-remove';
          b.innerHTML = '✕';
          b.onclick = function () { quitarFoto(idx); };
          d.appendChild(im);
          d.appendChild(b);
          box.appendChild(d);
        })(i);
      }
    }

    function guardarRegistro() {
      var inp = document.getElementById('nombre');
      var nombre = inp.value.replace(/^\s+|\s+$/g, '');
      if (!nombre) {
        alert('Escribe el proveedor o cliente antes de guardar.');
        inp.focus();
        return;
      }
      if (!fotosBorrador.length) {
        alert('Haz al menos una foto antes de guardar.');
        return;
      }
      var ahora = new Date();
      var fechaHoy = ahora.toLocaleDateString('es-ES');
      var reg = {
        nombre: nombre,
        fecha: fechaHoy,
        hora: ahora.toLocaleTimeString('es-ES'),
        imagenes: fotosBorrador.slice(),
        firma: firmaBorrador || null
      };
      guardarEnBD(reg, function (err) {
        if (err) {
          alert('No se pudo guardar el registro.');
          return;
        }
        diasAbiertos[fechaHoy] = true;
        inp.value = '';
        fotosBorrador = [];
        firmaBorrador = null;
        renderBorrador();
        renderFirma();
        cerrarCamara();
        document.getElementById('formularioRegistro').style.display = 'none';
        cargar();
        alert('Registro guardado.');
      });
    }

    function borrarRegistro(id) {
      if (!confirm('¿Borrar este registro?')) return;
      borrarEnBD(id, function () { cargar(); });
    }

    function escaparHTML(txt) {
      var d = document.createElement('div');
      d.textContent = txt || '';
      return d.innerHTML;
    }

    function crearTarjetaRegistro(r) {
      var fotos = r.imagenes ? r.imagenes : (r.imagen ? [r.imagen] : []);
      var fotosHtml = '';
      for (var f = 0; f < fotos.length; f++) {
        fotosHtml += '<div class="photo-card"><img src="' + fotos[f] + '"><a class="download-sm" href="' + fotos[f] + '" download="registro_' + r.id + '_' + (f + 1) + '.jpg">⬇ Foto ' + (f + 1) + '</a></div>';
      }
      var firmaHtml = r.firma ? '<div style="margin-top:10px;"><b>✍️ Firma:</b><br><img src="' + r.firma + '" style="max-width:100%; max-height:120px; background:#fff; margin-top:6px; border:1px solid #e2e8f0; border-radius:8px;"></div>' : '';
      var div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = '<div><b>🕒 ' + escaparHTML(r.hora) + '</b> &nbsp;|&nbsp; <b>🏭 ' + escaparHTML(r.nombre) + '</b></div>' +
        '<div class="photos-grid">' + fotosHtml + '</div>' +
        firmaHtml +
        '<button type="button" class="delete">🗑 Borrar</button>';
      div.querySelector('button.delete').onclick = function () { borrarRegistro(r.id); };
      return div;
    }

    function cargar() {
      obtenerRegistros(function (datos) {
        var h = document.getElementById('historial');
        var hoy = new Date().toLocaleDateString('es-ES');
        var hoyCount = 0;
        var gruposPorDia = {};
        var ordenDias = [];

        var rev = datos.slice().reverse();
        for (var i = 0; i < rev.length; i++) {
          var item = rev[i];
          var fecha = item.fecha || 'Sin fecha';
          if (fecha === hoy) hoyCount++;
          if (!gruposPorDia[fecha]) {
            gruposPorDia[fecha] = [];
            ordenDias.push(fecha);
          }
          gruposPorDia[fecha].push(item);
        }

        if (diasAbiertos[hoy] === undefined) {
          diasAbiertos[hoy] = true;
        }

        document.getElementById('contador').innerHTML = 'Hoy: ' + hoyCount;
        document.getElementById('totalHistorial').innerHTML = datos.length;

        var sel = document.getElementById('filtroDia');
        var valorPrevio = diaSeleccionado;
        sel.innerHTML = '<option value="TODOS">Todos los días (' + ordenDias.length + ')</option>';
        for (var d = 0; d < ordenDias.length; d++) {
          var fDia = ordenDias[d];
          var opt = document.createElement('option');
          opt.value = fDia;
          opt.textContent = (fDia === hoy ? 'Hoy · ' + fDia : fDia) + ' (' + gruposPorDia[fDia].length + ')';
          sel.appendChild(opt);
        }
        if (valorPrevio !== 'TODOS' && !gruposPorDia[valorPrevio]) {
          diaSeleccionado = 'TODOS';
        }
        sel.value = diaSeleccionado;

        if (!datos.length) {
          h.innerHTML = '<div style="text-align:center; padding:16px; color:#5c6b7c;">No hay registros guardados.</div>';
          return;
        }

        h.innerHTML = '';
        for (var j = 0; j < ordenDias.length; j++) {
          (function (fechaDia) {
            if (diaSeleccionado !== 'TODOS' && diaSeleccionado !== fechaDia) {
              return;
            }
            var listaDia = gruposPorDia[fechaDia];
            var abierto = !!diasAbiertos[fechaDia];

            var grupo = document.createElement('div');
            grupo.className = 'day-group';

            var btnDia = document.createElement('button');
            btnDia.type = 'button';
            btnDia.className = 'day-toggle';
            var etiquetaDia = (fechaDia === hoy) ? '📅 Hoy (' + fechaDia + ')' : '📅 ' + fechaDia;
            btnDia.innerHTML = '<span>' + etiquetaDia + '<span class="day-badge">' + listaDia.length + '</span></span>' +
              '<span>' + (abierto ? '▲' : '▼') + '</span>';
            btnDia.onclick = function () { toggleDia(fechaDia); };

            var contDia = document.createElement('div');
            contDia.className = abierto ? 'day-content open' : 'day-content';

            for (var rIdx = 0; rIdx < listaDia.length; rIdx++) {
              contDia.appendChild(crearTarjetaRegistro(listaDia[rIdx]));
            }

            grupo.appendChild(btnDia);
            grupo.appendChild(contDia);
            h.appendChild(grupo);
          })(ordenDias[j]);
        }
      });
    }

    initFirmaEventos();
    cargar();
  </script>
</body>
</html>
