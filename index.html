<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>TRANSPORTE INTERNO SYNTEGON TELSTAR</title><style>body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#eef3f8} .app{max-width:900px;margin:auto;padding:12px} .header{background:#0b3b78;color:#fff;border-radius:18px;padding:20px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15)} .logo{font-size:34px;font-weight:900;letter-spacing:1px} .sub{opacity:.9} .counter{margin-top:10px;background:#fff;color:#0b3b78;display:inline-block;padding:8px 14px;border-radius:20px;font-weight:700} .card{background:#fff;border-radius:18px;padding:16px;margin-top:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)} .bigbtn{width:100%;padding:24px;border:none;border-radius:18px;background:#0078d4;color:#fff;font-size:26px;font-weight:800} video{width:100%;border-radius:16px;margin-top:12px} .btn{width:100%;padding:16px;margin-top:10px;border:none;border-radius:12px;color:#fff;font-weight:700} .save{background:#107c10} .close{background:#d83b01} .grid{display:grid;gap:14px} .item{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)} .item img{width:100%;border-radius:12px;margin-top:10px} .actions{display:flex;gap:8px;margin-top:10px} .actions button,.actions a{flex:1;text-align:center;padding:10px;border:none;border-radius:10px;text-decoration:none;color:#fff;font-weight:700} .download{background:#0078d4} .delete{background:#c50f1f}</style></head><body><div class="app"><div class="header"><div class="logo">SYNTEGON</div><div class="sub">TRANSPORTE INTERNO TELSTAR</div><div id="contador" class="counter">Registros hoy: 0</div></div><div class="card"><button class="bigbtn" onclick="iniciarCamara()">📷 NUEVO REGISTRO</button><div id="camara" style="display:none"><video id="video" autoplay playsinline></video><button class="btn save" onclick="guardarFoto()">✅ GUARDAR FOTO</button><button class="btn close" onclick="cerrarCamara()">❌ CERRAR CÁMARA</button></div></div><div class="card"><h2>Historial de registros</h2><div id="historial" class="grid"></div></div></div><canvas id="canvas" style="display:none"></canvas><script>let stream=null;const video=document.getElementById('video');async function iniciarCamara(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;document.getElementById('camara').style.display='block';}catch(e){alert('No se pudo abrir la cámara');}}function cerrarCamara(){if(stream){stream.getTracks().forEach(t=>t.stop())}document.getElementById('camara').style.display='none';}function guardarFoto(){const c=document.getElementById('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);const img=c.toDataURL('image/jpeg',0.9);const d=new Date();const r={fecha:d.toLocaleDateString('es-ES'),hora:d.toLocaleTimeString('es-ES'),imagen:img};const datos=JSON.parse(localStorage.getItem('registrosTransporte')||'[]');datos.push(r);localStorage.setItem('registrosTransporte',JSON.stringify(datos));cargar();alert('Registro guardado');}function borrar(i){if(!confirm('¿Borrar registro?'))return;const datos=JSON.parse(localStorage.getItem('registrosTransporte')||'[]');datos.splice(i,1);localStorage.setItem('registrosTransporte',JSON.stringify(datos));cargar();}function cargar(){const datos=JSON.parse(localStorage.getItem('registrosTransporte')||'[]');const h=document.getElementById('historial');h.innerHTML='';const hoy=new Date().toLocaleDateString('es-ES');document.getElementById('contador').innerText='Registros hoy: '+datos.filter(x=>x.fecha===hoy).length;datos.slice().reverse().forEach((r,idx)=>{const real=datos.length-1-idx;h.innerHTML+=`<div class="item"><b>📅 ${r.fecha}</b><br><b>🕒 ${r.hora}</b><img src="${r.imagen}"><div class="actions"><a class="download" href="${r.imagen}" download="registro_${real}.jpg">⬇ Descargar</a><button class="delete" onclick="borrar(${real})">🗑 Borrar</button></div></div>`});}cargar();</script></body></html>
