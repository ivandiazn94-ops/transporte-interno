<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRANSPORTE INTERNO SYNTEGON TELSTAR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #eef3f8;
      color: #1b2430;
    }
    .app {
      max-width: 900px;
      margin: auto;
      padding: 12px;
    }
    .header {
      background: #0b3b78;
      color: #fff;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
    }
    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .sub {
      opacity: .92;
      margin-top: 4px;
      font-weight: 600;
    }
    .counter {
      margin-top: 12px;
      background: #fff;
      color: #0b3b78;
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
    }
    .field-label {
      display: block;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 6px;
      color: #0b3b78;
    }
    .input-nombre {
      width: 100%;
      padding: 14px 16px;
      font-size: 17px;
      border: 2px solid #cbd6e2;
      border-radius: 12px;
      outline: none;
      transition: border-color .2s;
    }
    .input-nombre:focus {
      border-color: #0078d4;
    }
    .bigbtn {
      width: 100%;
      padding: 22px;
      border: none;
      border-radius: 18px;
      background: #0078d4;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
    }
    .bigbtn:active {
      transform: scale(0.99);
    }
    .action-trigger {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: 2px solid #0078d4;
      border-radius: 12px;
      background: #eaf4fc;
      color: #005a9e;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .action-trigger:hover {
      background: #d8ebfa;
    }
    .sign-trigger {
      border-color: #0b3b78;
      background: #edf2f9;
      color: #0b3b78;
    }
    .sign-trigger:hover {
      background: #dce6f5;
    }
    .signature-box {
      margin-top: 14px;
      padding: 14px;
      border: 2px solid #0b3b78;
      border-radius: 16px;
      background: #f8fbff;
    }
    .signature-header {
      font-weight: 800;
      color: #0b3b78;
      margin-bottom: 10px;
      font-size: 16px;
    }
    #canvasFirma {
      width: 100%;
      height: 220px;
      display: block;
      background: #fff;
      border: 2px dashed #9fb3c8;
      border-radius: 12px;
      touch-action: none;
      cursor: crosshair;
    }
    .sign-preview {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid #d5e0ec;
      border-radius: 12px;
      background: #f9fbfe;
    }
    .sign-preview-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #0b3b78;
    }
    .sign-preview img {
      max-width: 100%;
      max-height: 130px;
      display: block;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .btn-mini-clear {
      background: #e2e8f0;
      color: #1b2430;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    video {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      background: #111;
      border-radius: 16px;
      margin-top: 12px;
      display: block;
    }
    .btn {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .snap { background: #0078d4; }
    .save { background: #107c10; }
    .clear { background: #5c6b7c; }
    .close { background: #d83b01; }
    .draft-photos {
      margin-top: 14px;
    }
    .draft-title {
      font-weight: 700;
      color: #0b3b78;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .thumb-box {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #d5e0ec;
      background: #111;
    }
    .thumb-box img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      display: block;
    }
    .thumb-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(197, 15, 31, 0.92);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .accordion-toggle {
      width: 100%;
      background: #f4f7fb;
      border: 2px solid #d5e0ec;
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 800;
      color: #0b3b78;
      cursor: pointer;
    }
    .accordion-toggle:hover {
      background: #eaf1f8;
    }
    .accordion-badge {
      background: #0b3b78;
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .accordion-arrow {
      font-size: 16px;
      transition: transform .2s ease;
    }
    .accordion-content {
      display: none;
      margin-top: 14px;
    }
    .accordion-content.open {
      display: block;
    }
    .grid {
      display: grid;
      gap: 14px;
    }
    .item {
      background: #f9fbfe;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
    }
    .item-meta {
      line-height: 1.5;
    }
    .item-name {
      margin-top: 6px;
      font-size: 16px;
      color: #0b3b78;
    }
    .item-sign {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #cbd6e2;
    }
    .item-sign-label {
      font-size: 14px;
      font-weight: 700;
      color: #0b3b78;
      margin-bottom: 6px;
    }
    .item-sign img {
      max-width: 100%;
      max-height: 140px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      display: block;
    }
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .photo-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .photo-card img {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 12px;
      background: #111;
    }
    .download-sm {
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      background: #0078d4;
      font-weight: 700;
      font-size: 13px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .actions button {
      flex: 1;
      text-align: center;
      padding: 12px;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .delete { background: #c50f1f; }
    .empty {
      text-align: center;
      color: #5c6b7c;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">SYNTEGON</div>
      <div class="sub">TRANSPORTE INTERNO TELSTAR</div>
      <div id="contador" class="counter">Registros hoy: 0</div>
    </div>

    <div class="card">
      <button type="button" id="btnNuevoRegistro" class="bigbtn">📷 NUEVO REGISTRO</button>

      <div id="formularioRegistro" style="display:none;">
        <div id="menuRegistro">
          <label class="field-label" for="nombre">Proveedor/cliente</label>
          <input
            type="text"
            id="nombre"
            class="input-nombre"
            placeholder="Escribe el proveedor o cliente..."
            autocomplete="organization"
          >

          <button type="button" id="btnAbrirFirma" class="action-trigger sign-trigger">
            ✍️ FIRMAR
          </button>

          <div id="previewFirmaBorrador" class="sign-preview" style="display:none;">
            <div class="sign-preview-top">
              <span>✅ Firma guardada en este registro</span>
              <button type="button" id="btnQuitarFirma" class="btn-mini-clear">Quitar firma</button>
            </div>
            <img id="imgFirmaBorrador" alt="Firma guardada">
          </div>

          <button type="button" id="btnAbrirCamara" class="action-trigger">
            📸 ABRIR CÁMARA
          </button>

          <div id="camara" style="display:none;">
            <video id="video" autoplay playsinline muted></video>
            <button type="button" id="btnSacarFoto" class="btn snap">📷 SACAR FOTO</button>
            <button type="button" id="btnCerrarCamara" class="btn close">❌ CERRAR CÁMARA</button>
          </div>

          <div id="seccionBorrador" class="draft-photos" style="display:none;">
            <div id="tituloBorrador" class="draft-title">Fotos capturadas (0):</div>
            <div id="miniaturasBorrador" class="thumbs"></div>
          </div>

          <button type="button" id="btnGuardarRegistro" class="btn save">✅ GUARDAR REGISTRO</button>
        </div>

        <div id="panelFirma" class="signature-box" style="display:none;">
          <div class="signature-header">✍️ Recuadro de firma</div>
          <canvas id="canvasFirma"></canvas>
          <button type="button" id="btnLimpiarFirma" class="btn clear">🧹 LIMPIAR FIRMA</button>
          <button type="button" id="btnGuardarFirma" class="btn save">✅ GUARDAR FIRMA</button>
          <button type="button" id="btnCancelarFirma" class="btn close">❌ CANCELAR</button>
        </div>
      </div>
    </div>

    <div class="card">
      <button
        type="button"
        id="btnHistorial"
        class="accordion-toggle"
        aria-expanded="false"
        aria-controls="historialPanel"
      >
        <span>
          📋 Historial de registros
          <span id="totalHistorial" class="accordion-badge">0</span>
        </span>
        <span id="flechaHistorial" class="accordion-arrow">▼</span>
      </button>

      <div id="historialPanel" class="accordion-content">
        <div id="historial" class="grid"></div>
      </div>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const DB_NAME = 'TransporteInternoDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'registros';
    const LEGACY_STORAGE_KEY = 'registrosTransporte';

    let db = null;
    let stream = null;
    let historialAbierto = false;
    let fotosBorrador = [];
    let firmaBorrador = null;

    let dibujandoFirma = false;
    let firmaConTrazos = false;
    let ultimoPuntoFirma = null;

    const video = document.getElementById('video');
    const canvasFirma = document.getElementById('canvasFirma');
    const ctxFirma = canvasFirma ? canvasFirma.getContext('2d') : null;

    function abrirBD() {
      return new Promise((resolve, reject) => {
        if (db) return resolve(db);
        if (!window.indexedDB) return reject(new Error('IndexedDB no disponible'));

        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };

        request.onsuccess = (event) => {
          db = event.target.result;
          resolve(db);
        };

        request.onerror = (event) => {
          reject(event.target.error);
        };
      });
    }

    async function migrarDesdeLocalStorageSiExiste() {
      try {
        const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
        if (!raw) return;
        const antiguos = JSON.parse(raw);
        if (!Array.isArray(antiguos) || antiguos.length === 0) return;

        const database = await abrirBD();
        const tx = database.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);

        for (const item of antiguos) {
          const fotos = Array.isArray(item.imagenes)
            ? item.imagenes
            : (item.imagen ? [item.imagen] : []);
          store.add({
            nombre: item.nombre || 'Sin especificar',
            fecha: item.fecha || '',
            hora: item.hora || '',
            imagenes: fotos,
            firma: item.firma || null
          });
        }

        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });

        localStorage.removeItem(LEGACY_STORAGE_KEY);
      } catch (e) {
        console.warn('No se pudo migrar datos antiguos:', e);
      }
    }

    async function obtenerTodosLosRegistros() {
      const database = await abrirBD();
      return new Promise((resolve, reject) => {
        const tx = database.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
    }

    async function insertarRegistro(registro) {
      const database = await abrirBD();
      return new Promise((resolve, reject) => {
        const tx = database.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const request = store.add(registro);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function eliminarRegistroPorId(id) {
      const database = await abrirBD();
      return new Promise((resolve, reject) => {
        const tx = database.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const request = store.delete(id);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function abrirFormulario() {
      cerrarCamara();
      fotosBorrador = [];
      firmaBorrador = null;
      renderBorrador();
      renderPreviewFirma();
      document.getElementById('panelFirma').style.display = 'none';
      document.getElementById('menuRegistro').style.display = 'block';
      document.getElementById('formularioRegistro').style.display = 'block';
      const inputNombre = document.getElementById('nombre');
      if (inputNombre) {
        inputNombre.value = '';
        inputNombre.focus({ preventScroll: true });
      }
    }

    function prepararCanvasFirma() {
      if (!canvasFirma || !ctxFirma) return;
      const rect = canvasFirma.getBoundingClientRect();
      const ancho = Math.max(300, Math.round(rect.width || 600));
      const alto = Math.max(180, Math.round(rect.height || 220));
      canvasFirma.width = ancho;
      canvasFirma.height = alto;

      ctxFirma.fillStyle = '#ffffff';
      ctxFirma.
