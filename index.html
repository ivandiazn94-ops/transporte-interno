<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRANSPORTE INTERNO SYNTEGON TELSTAR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #eef3f8;
      color: #1b2430;
    }
    .app {
      max-width: 900px;
      margin: auto;
      padding: 12px;
    }
    .header {
      background: #0b3b78;
      color: #fff;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
    }
    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .sub {
      opacity: .92;
      margin-top: 4px;
      font-weight: 600;
    }
    .counter {
      margin-top: 12px;
      background: #fff;
      color: #0b3b78;
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
    }
    .field-label {
      display: block;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 6px;
      color: #0b3b78;
    }
    .input-nombre {
      width: 100%;
      padding: 14px 16px;
      font-size: 17px;
      border: 2px solid #cbd6e2;
      border-radius: 12px;
      outline: none;
      transition: border-color .2s;
    }
    .input-nombre:focus {
      border-color: #0078d4;
    }
    .bigbtn {
      width: 100%;
      padding: 22px;
      border: none;
      border-radius: 18px;
      background: #0078d4;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
    }
    .bigbtn:active {
      transform: scale(0.99);
    }
    .cam-trigger {
      width: 100%;
      padding: 16px;
      margin-top: 14px;
      border: 2px solid #0078d4;
      border-radius: 12px;
      background: #eaf4fc;
      color: #005a9e;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .cam-trigger:hover {
      background: #d8ebfa;
    }
    video {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      background: #111;
      border-radius: 16px;
      margin-top: 12px;
      display: block;
    }
    .btn {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .snap { background: #0078d4; }
    .save { background: #107c10; }
    .close { background: #d83b01; }
    .draft-photos {
      margin-top: 14px;
    }
    .draft-title {
      font-weight: 700;
      color: #0b3b78;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .thumb-box {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #d5e0ec;
      background: #111;
    }
    .thumb-box img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      display: block;
    }
    .thumb-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(197, 15, 31, 0.92);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .accordion-toggle {
      width: 100%;
      background: #f4f7fb;
      border: 2px solid #d5e0ec;
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 800;
      color: #0b3b78;
      cursor: pointer;
    }
    .accordion-toggle:hover {
      background: #eaf1f8;
    }
    .accordion-badge {
      background: #0b3b78;
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .accordion-arrow {
      font-size: 16px;
      transition: transform .2s ease;
    }
    .accordion-content {
      display: none;
      margin-top: 14px;
    }
    .accordion-content.open {
      display: block;
    }
    .grid {
      display: grid;
      gap: 14px;
    }
    .item {
      background: #f9fbfe;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
    }
    .item-meta {
      line-height: 1.5;
    }
    .item-name {
      margin-top: 6px;
      font-size: 16px;
      color: #0b3b78;
    }
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .photo-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .photo-card img {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 12px;
      background: #111;
    }
    .download-sm {
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      background: #0078d4;
      font-weight: 700;
      font-size: 13px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .actions button {
      flex: 1;
      text-align: center;
      padding: 12px;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .delete { background: #c50f1f; }
    .empty {
      text-align: center;
      color: #5c6b7c;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">SYNTEGON</div>
      <div class="sub">TRANSPORTE INTERNO TELSTAR</div>
      <div id="contador" class="counter">Registros hoy: 0</div>
    </div>

    <div class="card">
      <button type="button" class="bigbtn" onclick="abrirFormulario()">📷 NUEVO REGISTRO</button>

      <div id="formularioRegistro" style="display:none;">
        <label class="field-label" for="nombre">Proveedor/cliente</label>
        <input
          type="text"
          id="nombre"
          class="input-nombre"
          placeholder="Escribe el proveedor o cliente..."
          autocomplete="organization"
        >

        <button type="button" id="btnAbrirCamara" class="cam-trigger" onclick="iniciarCamara()">
          📸 ABRIR CÁMARA
        </button>

        <div id="camara" style="display:none;">
          <video id="video" autoplay playsinline muted></video>
          <button type="button" class="btn snap" onclick="sacarFoto()">📷 SACAR FOTO</button>
          <button type="button" class="btn close" onclick="cerrarCamara()">❌ CERRAR CÁMARA</button>
        </div>

        <div id="seccionBorrador" class="draft-photos" style="display:none;">
          <div id="tituloBorrador" class="draft-title">Fotos capturadas (0):</div>
          <div id="miniaturasBorrador" class="thumbs"></div>
          <button type="button" class="btn save" onclick="guardarRegistro()">✅ GUARDAR REGISTRO</button>
        </div>
      </div>
    </div>

    <div class="card">
      <button
        type="button"
        id="btnHistorial"
        class="accordion-toggle"
        onclick="toggleHistorial()"
        aria-expanded="false"
        aria-controls="historialPanel"
      >
        <span>
          📋 Historial de registros
          <span id="totalHistorial" class="accordion-badge">0</span>
        </span>
        <span id="flechaHistorial" class="accordion-arrow">▼</span>
      </button>

      <div id="historialPanel" class="accordion-content">
        <div id="historial" class="grid"></div>
      </div>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const DB_NAME = 'TransporteInternoDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'registros';
    const LEGACY_STORAGE_KEY = 'registrosTransporte';

    let db = null;
    let stream = null;
    let historialAbierto = false;
    let fotosBorrador = [];
    const video = document.getElementById('video');

    function abrirBD() {
      return new Promise((resolve, reject) => {
        if (db) return resolve(db);
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };

        request.onsuccess = (event) => {
          db = event.target.result;
          resolve(db);
        };

        request.onerror = (event) => {
          reject(event.target.error);
        };
      });
    }

    async function migrarDesdeLocalStorageSiExiste() {
      try {
        const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
        if (!raw) return;
        const antiguos = JSON.parse(raw);
        if (!Array.isArray(antiguos) || antiguos.length === 0) return;

        const database = await abrirBD();
        const tx = database.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);

        for (const item of antiguos) {
          const fotos = Array.isArray(item.imagenes)
            ? item.imagenes
            : (item.imagen ? [item.imagen] : []);
          store.add({
            nombre: item.nombre || 'Sin especificar',
            fecha: item.fecha || '',
            hora: item.hora || '',
            imagenes: fotos
          });
        }

        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });

        localStorage.removeItem(LEGACY_STORAGE_KEY);
      } catch (e) {
        console.warn('No se pudo migrar datos antiguos:', e);
      }
    }

    async function obtenerTodosLosRegistros() {
      const database = await abrirBD();
      return new Promise((resolve, reject) => {
        const tx = database.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
    }

    async function insertarRegistro(registro) {
      const database = await abrirBD();
      return new Promise((resolve, reject) => {
        const tx = database.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const request = store.add(registro);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function eliminarRegistroPorId(id) {
      const database = await abrirBD();
      return new Promise((resolve, reject) => {
        const tx = database.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const request = store.delete(id);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function abrirFormulario() {
      cerrarCamara();
      fotosBorrador = [];
      renderBorrador();
      document.getElementById('formularioRegistro').style.display = 'block';
      document.getElementById('nombre').focus({ preventScroll: true });
    }

    function toggleHistorial() {
      historialAbierto = !historialAbierto;
      const panel = document.getElementById('historialPanel');
      const flecha = document.getElementById('flechaHistorial');
      const boton = document.getElementById('btnHistorial');

      panel.classList.toggle('open', historialAbierto);
      boton.setAttribute('aria-expanded', historialAbierto ? 'true' : 'false');
      flecha.style.transform = historialAbierto ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    async function iniciarCamara() {
      try {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
        }
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        document.getElementById('camara').style.display = 'block';
        document.getElementById('btnAbrirCamara').style.display = 'none';
      } catch (e) {
        alert('No se pudo abrir la cámara. Revisa los permisos del navegador.');
      }
    }

    function cerrarCamara() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      document.getElementById('camara').style.display = 'none';
      document.getElementById('btnAbrirCamara').style.display = 'block';
    }

    function capturarImagen() {
      if (!stream || video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
        return null;
      }

      const maxAncho = 1280;
      let ancho = video.videoWidth;
      let alto = video.videoHeight;

      if (ancho > maxAncho) {
        const escala = maxAncho / ancho;
        ancho = maxAncho;
        alto = Math.round(alto * escala);
      }

      const canvas = document.getElementById('canvas');
      canvas.width = ancho;
      canvas.height = alto;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, ancho, alto);

      const muestra = ctx.getImageData(0, 0, Math.min(20, ancho), Math.min(20, alto)).data;
      let sumaBrillo = 0;
      for (let i = 0; i < muestra.length; i += 4) {
        sumaBrillo += muestra[i] + muestra[i + 1] + muestra[i + 2];
      }
      if (sumaBrillo === 0) {
        return null;
      }

      return canvas.toDataURL('image/jpeg', 0.72);
    }

    function sacarFoto() {
      const img = capturarImagen();
      if (!img) {
        alert('La cámara aún no tiene imagen lista o ha salido en negro. Espera un segundo y vuelve a intentarlo.');
        return;
      }
      fotosBorrador.push(img);
      renderBorrador();
    }

    function quitarFotoBorrador(index) {
      fotosBorrador.splice(index, 1);
      renderBorrador();
    }

    function renderBorrador() {
      const seccion = document.getElementById('seccionBorrador');
      const titulo = document.getElementById('tituloBorrador');
      const contenedor = document.getElementById('miniaturasBorrador');

      if (fotosBorrador.length === 0) {
        seccion.style.display = 'none';
        contenedor.innerHTML = '';
        return;
      }

      seccion.style.display = 'block';
      titulo.textContent = `Fotos capturadas (${fotosBorrador.length}):`;
      contenedor.innerHTML = '';

      fotosBorrador.forEach((foto, idx) => {
        contenedor.innerHTML += `
          <div class="thumb-box">
            <img src="${foto}" alt="Foto ${idx + 1}">
            <button type="button" class="thumb-remove" onclick="quitarFotoBorrador(${idx})" title="Quitar foto">✕</button>
          </div>
        `;
      });
    }

    async function guardarRegistro() {
      const inputNombre = document.getElementById('nombre');
      const nombre = inputNombre.value.trim();

      if (!nombre) {
        alert('Por favor, introduce el proveedor o cliente antes de guardar.');
        inputNombre.focus();
        return;
      }

      if (fotosBorrador.length === 0) {
        alert('Haz al menos una foto antes de guardar el registro.');
        return;
      }

      const ahora = new Date();
      const registro = {
        nombre: nombre,
        fecha: ahora.toLocaleDateString('es-ES'),
        hora: ahora.toLocaleTimeString('es-ES'),
        imagenes: [...fotosBorrador]
      };

      try {
        await insertarRegistro(registro);
      } catch (e) {
        alert('No se pudo guardar el registro en el almacenamiento del navegador.');
        return;
      }

      inputNombre.value = '';
      fotosBorrador = [];
      renderBorrador();
      cerrarCamara();
      document.getElementById('formularioRegistro').style.display = 'none';
      await cargar();
      alert('Registro guardado correctamente.');
    }

    async function borrar(id) {
      if (!confirm('¿Borrar este registro?')) return;
      await eliminarRegistroPorId(id);
      await cargar();
    }

    function escaparTexto(texto) {
      const div = document.createElement('div');
      div.textContent = texto;
      return div.innerHTML;
    }

    async function cargar() {
      const datos = await obtenerTodosLosRegistros();
      const h = document.getElementById('historial');
      h.innerHTML = '';

      const hoy = new Date().toLocaleDateString('es-ES');
      const registrosHoy = datos.filter(x => x.fecha === hoy).length;
      document.getElementById('contador').innerText = 'Registros hoy: ' + registrosHoy;
      document.getElementById('totalHistorial').innerText = datos.length;

      if (datos.length === 0) {
        h.innerHTML = '<div class="empty">Aún no hay registros guardados.</div>';
        return;
      }

      datos.slice().reverse().forEach((r) => {
        const nombreSeguro = escaparTexto(r.nombre || 'Sin especificar');
        const nombreArchivo = (r.nombre || 'registro')
          .toLowerCase()
          .replace(/[^a-z0-9]+/gi, '_')
          .replace(/^_|_$/g, '') || 'registro';

        const fotos = Array.isArray(r.imagenes)
          ? r.imagenes
          : (r.imagen ? [r.imagen] : []);

        const fotosHtml = fotos.map((imgSrc, fIdx) => `
          <div class="photo-card">
            <img src="${imgSrc}" alt="Foto ${fIdx + 1} de ${nombreSeguro}">
            <a class="download-sm" href="${imgSrc}" download="transporte_${nombreArchivo}_${r.id}_foto${fIdx + 1}.jpg">⬇ Foto ${fIdx + 1}</a>
          </div>
        `).join('');

        h.innerHTML += `
          <div class="item">
            <div class="item-meta">
              <b>📅 ${escaparTexto(r.fecha)}</b> &nbsp;|&nbsp; <b>🕒 ${escaparTexto(r.hora)}</b>
              <div class="item-name">🏭 <b>${nombreSeguro}</b> · ${fotos.length} ${fotos.length === 1 ? 'foto' : 'fotos'}</div>
            </div>
            <div class="photos-grid">
              ${fotosHtml}
            </div>
            <div class="actions">
              <button class="delete" onclick="borrar(${r.id})">🗑 Borrar registro</button>
            </div>
          </div>
        `;
      });
    }

    (async function iniciarApp() {
      await abrirBD();
      await migrarDesdeLocalStorageSiExiste();
      await cargar();
    })();
  </script>
</body>
</html>
